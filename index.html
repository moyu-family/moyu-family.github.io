<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý thông tin gia đình</title>
  <!-- Thư viện mã hóa quân sự AES-256 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --navy: #0f172a;
      --gold: #b45309;
      --gold-light: #fef3c7;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
      --shadow-hover: 0 20px 35px -8px rgba(15, 23, 42, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding: 30px 16px; }
    .container { max-width: 960px; margin: 0 auto; }
    .hidden { display: none !important; }

    /* Màn hình Khóa */
    .modal-box {
      max-width: 400px; margin: 80px auto; background: var(--card-bg);
      padding: 34px 28px; border-radius: 20px; border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md); text-align: center;
    }
    .modal-title { font-size: 1.35rem; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
    .modal-desc { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.4; }

    /* Top Bar */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; margin-bottom: 28px; background: #ffffff;
      border: 1px solid var(--border-color); border-radius: 14px; box-shadow: var(--shadow-sm);
    }
    .brand-title { font-size: 1.25rem; font-weight: 700; color: var(--navy); }
    .btn-group { display: flex; gap: 8px; align-items: center; }

    button {
      padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent;
    }
    .btn-primary { background: var(--navy); color: #ffffff; }
    .btn-primary:hover { background: #1e293b; }
    .btn-outline { background: #ffffff; border-color: var(--border-color); color: var(--navy); }
    .btn-outline:hover { background: #f1f5f9; }
    .btn-danger { background: #fff1f2; color: #e11d48; border: 1px solid #ffe4e6; }

    /* Thẻ thành viên */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .member-card {
      background: var(--card-bg); border-radius: 16px; padding: 24px 16px; text-align: center;
      border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); cursor: pointer; transition: 0.2s ease;
    }
    .member-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    .avatar-wrap { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; margin: 0 auto 14px; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.08); background: #f1f5f9; }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .member-name { font-weight: 700; font-size: 1.05rem; color: var(--navy); margin-bottom: 4px; }
    .member-role { display: inline-block; font-size: 0.72rem; font-weight: 600; color: var(--gold); background: var(--gold-light); padding: 3px 8px; border-radius: 30px; }

    /* Chi tiết & Form */
    .detail-view, .form-view { background: var(--card-bg); border-radius: 18px; padding: 28px; border: 1px solid var(--border-color); box-shadow: var(--shadow-md); }
    .detail-header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border-color); }
    .detail-avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .info-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 24px; }
    @media(max-width: 640px) { .info-group { grid-template-columns: 1fr; } }
    .info-item { background: #fafbfd; padding: 14px 16px; border-radius: 12px; border: 1px solid #f1f5f9; }
    .info-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; font-weight: 700; }
    .info-val { font-size: 0.95rem; font-weight: 600; color: var(--navy); word-break: break-all; }

    .bank-card { display: flex; align-items: center; gap: 14px; background: #ffffff; padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border-color); }
    .bank-logo { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: #fafbfd; border: 1px solid #f1f5f9; padding: 2px; }

    .form-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--navy); margin-bottom: 5px; }
    input, select { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.9rem; background: #fafbfd; }
    input:focus, select:focus { border-color: var(--navy); background: #fff; outline: none; }
    .bank-edit-row { display: flex; gap: 6px; margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Màn hình Đăng nhập (Duy nhất 1 ô Mật khẩu) -->
  <div id="authScreen" class="modal-box">
    <div style="font-size: 2.5rem; margin-bottom: 10px;">🔐</div>
    <div class="modal-title">Hồ sơ gia đình</div>
    <div class="modal-desc">Nhập mật khẩu chính để giải mã và đồng bộ dữ liệu.</div>
    <form onsubmit="handleAuth(event)">
      <div class="form-group">
        <input type="password" id="authPwd" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
      </div>
      <button type="submit" id="btnUnlock" class="btn-primary" style="width:100%; justify-content:center; padding:10px;">Mở khóa</button>
    </form>
    <div id="authError" style="color:#e11d48; font-size:0.85rem; margin-top:12px; display:none;"></div>
  </div>

  <!-- Ứng dụng chính -->
  <div id="appScreen" class="hidden">
    <div class="top-bar">
      <div class="brand-title">👨‍👩‍👧‍👦 Quản lý gia đình</div>
      <div class="btn-group">
        <button class="btn-primary" onclick="openForm()">＋ Thêm thành viên</button>
        <button class="btn-danger" onclick="lockApp()">🔒 Khóa</button>
      </div>
    </div>

    <div id="homeView">
      <div class="grid" id="memberGrid"></div>
    </div>

    <!-- Chi tiết thành viên -->
    <div id="detailView" class="detail-view hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <button class="btn-outline" onclick="showHome()">← Quay lại</button>
        <div style="display: flex; gap: 8px;">
          <button class="btn-outline" onclick="editCurrentMember()">Chỉnh sửa</button>
          <button class="btn-danger" onclick="deleteCurrentMember()">Xóa</button>
        </div>
      </div>

      <div class="detail-header">
        <img id="dtAvatar" class="detail-avatar" src="" alt="Avatar">
        <div>
          <h2 id="dtName" style="color:var(--navy); font-size:1.45rem;"></h2>
          <span id="dtRole" class="member-role"></span>
        </div>
      </div>

      <div class="info-group">
        <div class="info-item"><div class="info-label">Ngày sinh</div><div class="info-val" id="dtDob"></div></div>
        <div class="info-item"><div class="info-label">Nơi sinh</div><div class="info-val" id="dtPob"></div></div>
        <div class="info-item"><div class="info-label">Số CCCD / Định danh</div><div class="info-val" id="dtCccd"></div></div>
        <div class="info-item"><div class="info-label">Ngày cấp</div><div class="info-val" id="dtCccdDate"></div></div>
        <div class="info-item"><div class="info-label">Bảo hiểm y tế</div><div class="info-val" id="dtBhyt"></div></div>
        <div class="info-item"><div class="info-label">Mã số thuế cũ</div><div class="info-val" id="dtTax"></div></div>
        <div class="info-item"><div class="info-label" id="specialLabel"></div><div class="info-val" id="specialVal"></div></div>
      </div>

      <div style="font-weight:700; color:var(--navy); margin-bottom:12px;">💳 Tài khoản ngân hàng</div>
      <div id="dtBanks"></div>
    </div>

    <!-- Form Nhập/Sửa -->
    <div id="formView" class="form-view hidden">
      <h2 id="formHeading" style="font-size: 1.35rem; font-weight: 700; color: var(--navy); margin-bottom: 20px;">Thông tin thành viên</h2>
      <form id="memberForm" onsubmit="saveMember(event)">
        <input type="hidden" id="fId">
        <div class="form-group">
          <label>Đối tượng</label>
          <select id="fType" onchange="toggleSpecialInput()">
            <option value="adult">Người lớn</option>
            <option value="child">Trẻ em</option>
          </select>
        </div>
        <div class="form-group"><label>Họ và tên</label><input type="text" id="fName" required></div>
        <div class="form-group"><label>URL Ảnh đại diện</label><input type="text" id="fAvatar" placeholder="https://..."></div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group">
            <label>Ngày sinh (dd/mm/yyyy)</label>
            <input type="text" id="fDob" placeholder="dd/mm/yyyy" maxlength="10" oninput="maskDateInput(this)">
          </div>
          <div class="form-group"><label>Nơi sinh</label><input type="text" id="fPob"></div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group"><label>Số CCCD / Định danh</label><input type="text" id="fCccd"></div>
          <div class="form-group">
            <label>Ngày cấp (dd/mm/yyyy)</label>
            <input type="text" id="fCccdDate" placeholder="dd/mm/yyyy" maxlength="10" oninput="maskDateInput(this)">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group"><label>Mã BHYT</label><input type="text" id="fBhyt"></div>
          <div class="form-group"><label>Mã số thuế cũ</label><input type="text" id="fTax"></div>
        </div>

        <div class="form-group">
          <label id="fSpecialLabel">Mã nhân viên</label>
          <input type="text" id="fSpecialCode">
        </div>

        <div class="form-group" style="margin-top:20px;">
          <label>Tài khoản ngân hàng</label>
          <div id="bankInputs"></div>
          <button type="button" class="btn-outline" style="margin-top:6px;" onclick="addBankRow()">+ Thêm ngân hàng</button>
        </div>

        <div style="display:flex; gap:10px; margin-top:26px;">
          <button type="submit" id="btnSaveMember" class="btn-primary">Lưu hồ sơ</button>
          <button type="button" class="btn-outline" onclick="cancelForm()">Đóng</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // =========================================================================
  // DÁN ĐƯỜNG LINK DATABASE FIREBASE CỦA BẠN VÀO DƯỚI ĐÂY (nhớ có dấu / ở cuối)
  const FIREBASE_DB_URL = "https://moyu-family-default-rtdb.asia-southeast1.firebasedatabase.app/";
  // =========================================================================

  let masterPassword = null;
  let members = [];
  let currentMemberId = null;

  async function handleAuth(e) {
    e.preventDefault();
    const pwd = document.getElementById('authPwd').value;
    const btn = document.getElementById('btnUnlock');
    const errEl = document.getElementById('authError');
    errEl.style.display = 'none';

    if (FIREBASE_DB_URL.includes("family-app-xxxxx")) {
      errEl.innerText = "Bạn chưa thay đường link Firebase vào dòng 177 trong code!";
      errEl.style.display = "block";
      return;
    }

    btn.innerText = 'Đang kiểm tra...';

    try {
      // Đọc dữ liệu từ Firebase
      const res = await fetch(`${FIREBASE_DB_URL}data.json`);
      const cloudData = await res.json();

      if (!cloudData) {
        // Lần đầu sử dụng, chưa có dữ liệu trên đám mây
        masterPassword = pwd;
        members = [];
        await pushToFirebase();
        unlockApp();
      } else {
        // Giải mã bằng AES-256
        try {
          const bytes = CryptoJS.AES.decrypt(cloudData, pwd);
          const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
          if (!decryptedStr) throw new Error();
          members = JSON.parse(decryptedStr);
          masterPassword = pwd;
          unlockApp();
        } catch (err) {
          errEl.innerText = 'Mật khẩu không chính xác!';
          errEl.style.display = 'block';
        }
      }
    } catch (err) {
      errEl.innerText = 'Lỗi kết nối Firebase: ' + err.message;
      errEl.style.display = 'block';
    } finally {
      btn.innerText = 'Mở khóa';
    }
  }

  // Lưu lên Firebase
  async function pushToFirebase() {
    const cipherText = CryptoJS.AES.encrypt(JSON.stringify(members), masterPassword).toString();
    const res = await fetch(`${FIREBASE_DB_URL}data.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cipherText)
    });
    if (!res.ok) throw new Error('Không thể ghi dữ liệu lên Firebase!');
  }

  function unlockApp() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    renderGrid();
  }

  function lockApp() {
    masterPassword = null;
    members = [];
    document.getElementById('authPwd').value = '';
    document.getElementById('appScreen').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
  }

  function maskDateInput(input) {
    let v = input.value.replace(/\D/g, '').slice(0, 8);
    if (v.length >= 5) input.value = `${v.slice(0, 2)}/${v.slice(2, 4)}/${v.slice(4)}`;
    else if (v.length >= 3) input.value = `${v.slice(0, 2)}/${v.slice(2)}`;
    else input.value = v;
  }

  function isValidDateVN(str) {
    if (!str) return true;
    const m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return false;
    const day = parseInt(m[1], 10), month = parseInt(m[2], 10), year = parseInt(m[3], 10);
    return !(month < 1 || month > 12 || day < 1 || day > 31 || year < 1900 || year > 2100);
  }

  function renderGrid() {
    const grid = document.getElementById('memberGrid');
    grid.innerHTML = '';
    if (members.length === 0) {
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-muted);">Chưa có thành viên nào. Bấm "+ Thêm thành viên" để bắt đầu!</div>';
      return;
    }
    members.forEach(m => {
      const card = document.createElement('div');
      card.className = 'member-card';
      card.onclick = () => viewDetails(m.id);
      card.innerHTML = `
        <div class="avatar-wrap">
          <img src="${m.avatar || 'https://via.placeholder.com/150?text=No+Img'}" onerror="this.src='https://via.placeholder.com/150?text=Error'">
        </div>
        <div class="member-name">${m.name}</div>
        <span class="member-role">${m.type === 'child' ? 'Trẻ em' : 'Người lớn'}</span>
      `;
      grid.appendChild(card);
    });
  }

  function viewDetails(id) {
    const m = members.find(item => item.id === id);
    if (!m) return;
    currentMemberId = id;
    document.getElementById('homeView').classList.add('hidden');
    document.getElementById('formView').classList.add('hidden');
    document.getElementById('detailView').classList.remove('hidden');

    document.getElementById('dtAvatar').src = m.avatar || 'https://via.placeholder.com/150?text=No+Img';
    document.getElementById('dtName').innerText = m.name;
    document.getElementById('dtRole').innerText = m.type === 'child' ? 'Trẻ em' : 'Người lớn';
    document.getElementById('dtDob').innerText = m.dob || '-';
    document.getElementById('dtPob').innerText = m.pob || '-';
    document.getElementById('dtCccd').innerText = m.cccd || '-';
    document.getElementById('dtCccdDate').innerText = m.cccdDate || '-';
    document.getElementById('dtBhyt').innerText = m.bhyt || '-';
    document.getElementById('dtTax').innerText = m.tax || '-';

    document.getElementById('specialLabel').innerText = m.type === 'child' ? 'Mã học sinh' : 'Mã nhân viên';
    document.getElementById('specialVal').innerText = m.specialCode || '-';

    const bList = document.getElementById('dtBanks');
    bList.innerHTML = '';
    if (m.banks && m.banks.length > 0) {
      m.banks.forEach(b => {
        bList.innerHTML += `
          <div class="bank-card">
            <img class="bank-logo" src="${b.logo || 'https://via.placeholder.com/50?text=Bank'}" onerror="this.src='https://via.placeholder.com/50?text=Bank'">
            <div>
              <div style="font-weight:700; color:var(--navy);">${b.bankName}</div>
              <div style="color:var(--text-muted); font-size:0.88rem;">STK: ${b.accNum}</div>
            </div>
          </div>
        `;
      });
    } else {
      bList.innerHTML = '<div style="color:var(--text-muted); font-size:0.88rem;">Chưa có tài khoản ngân hàng nào.</div>';
    }
  }

  function showHome() {
    document.getElementById('homeView').classList.remove('hidden');
    document.getElementById('detailView').classList.add('hidden');
    document.getElementById('formView').classList.add('hidden');
    renderGrid();
  }

  function openForm(member = null) {
    document.getElementById('homeView').classList.add('hidden');
    document.getElementById('detailView').classList.add('hidden');
    document.getElementById('formView').classList.remove('hidden');

    const form = document.getElementById('memberForm');
    form.reset();
    document.getElementById('bankInputs').innerHTML = '';

    if (member) {
      document.getElementById('formHeading').innerText = 'Chỉnh sửa thông tin';
      document.getElementById('fId').value = member.id;
      document.getElementById('fType').value = member.type;
      document.getElementById('fName').value = member.name;
      document.getElementById('fAvatar').value = member.avatar;
      document.getElementById('fDob').value = member.dob || '';
      document.getElementById('fPob').value = member.pob;
      document.getElementById('fCccd').value = member.cccd;
      document.getElementById('fCccdDate').value = member.cccdDate || '';
      document.getElementById('fBhyt').value = member.bhyt;
      document.getElementById('fTax').value = member.tax;
      document.getElementById('fSpecialCode').value = member.specialCode;

      if (member.banks) member.banks.forEach(b => addBankRow(b.bankName, b.accNum, b.logo));
    } else {
      document.getElementById('formHeading').innerText = 'Thêm thành viên mới';
      document.getElementById('fId').value = '';
    }
    toggleSpecialInput();
  }

  function toggleSpecialInput() {
    const type = document.getElementById('fType').value;
    document.getElementById('fSpecialLabel').innerText = type === 'child' ? 'Mã học sinh' : 'Mã nhân viên';
  }

  function addBankRow(name = '', acc = '', logo = '') {
    const wrap = document.getElementById('bankInputs');
    const div = document.createElement('div');
    div.className = 'bank-edit-row';
    div.innerHTML = `
      <input type="text" placeholder="Ngân hàng" value="${name}" class="b-name" style="flex:1;">
      <input type="text" placeholder="Số tài khoản" value="${acc}" class="b-acc" style="flex:1;">
      <input type="text" placeholder="URL Logo" value="${logo}" class="b-logo" style="flex:1;">
      <button type="button" class="btn-danger" style="padding:4px 8px;" onclick="this.parentElement.remove()">✕</button>
    `;
    wrap.appendChild(div);
  }

  async function saveMember(e) {
    e.preventDefault();
    const dobVal = document.getElementById('fDob').value.trim();
    const cccdDateVal = document.getElementById('fCccdDate').value.trim();

    if (!isValidDateVN(dobVal)) { alert('Ngày sinh không đúng định dạng dd/mm/yyyy'); return; }
    if (!isValidDateVN(cccdDateVal)) { alert('Ngày cấp CCCD không đúng định dạng dd/mm/yyyy'); return; }

    const id = document.getElementById('fId').value || Date.now().toString();
    const bNames = document.querySelectorAll('.b-name');
    const bAccs = document.querySelectorAll('.b-acc');
    const bLogos = document.querySelectorAll('.b-logo');
    const banks = [];
    for (let i = 0; i < bNames.length; i++) {
      if (bNames[i].value.trim()) banks.push({ bankName: bNames[i].value, accNum: bAccs[i].value, logo: bLogos[i].value });
    }

    const memberObj = {
      id: id,
      type: document.getElementById('fType').value,
      name: document.getElementById('fName').value,
      avatar: document.getElementById('fAvatar').value,
      dob: dobVal,
      pob: document.getElementById('fPob').value,
      cccd: document.getElementById('fCccd').value,
      cccdDate: cccdDateVal,
      bhyt: document.getElementById('fBhyt').value,
      tax: document.getElementById('fTax').value,
      specialCode: document.getElementById('fSpecialCode').value,
      banks: banks
    };

    const idx = members.findIndex(m => m.id === id);
    if (idx >= 0) members[idx] = memberObj;
    else members.push(memberObj);

    const btn = document.getElementById('btnSaveMember');
    btn.innerText = 'Đang lưu lên Firebase...';
    try {
      await pushToFirebase();
      viewDetails(id);
    } catch (err) {
      alert('Lỗi lưu dữ liệu: ' + err.message);
    } finally {
      btn.innerText = 'Lưu hồ sơ';
    }
  }

  function cancelForm() {
    if (currentMemberId) viewDetails(currentMemberId);
    else showHome();
  }

  function editCurrentMember() {
    const m = members.find(item => item.id === currentMemberId);
    if (m) openForm(m);
  }

  async function deleteCurrentMember() {
    if (confirm('Bạn có chắc muốn xoá hồ sơ này?')) {
      members = members.filter(m => m.id !== currentMemberId);
      try {
        await pushToFirebase();
        showHome();
      } catch (err) {
        alert('Lỗi xóa dữ liệu: ' + err.message);
      }
    }
  }
</script>
</body>
</html>
