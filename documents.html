<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hồ sơ lưu trữ</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="style.css?v=2"><script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script></head>
<body data-page="documents"><div class="container">
  <div id="authScreen" class="modal-box"><div style="font-size:2.5rem; margin-bottom:10px;">🔐</div><div class="modal-title">Hồ sơ gia đình</div><div class="modal-desc">Nhập mật khẩu để mở khóa và đồng bộ dữ liệu.</div><form onsubmit="handleAuth(event)"><div class="form-group"><input type="password" id="authPwd" placeholder="Nhập mật khẩu..." required></div><button type="submit" id="btnUnlock" class="btn-primary" style="width:100%; justify-content:center;">Mở khóa</button></form><div class="auth-biometric-actions"><div id="biometricRegisteredActions" class="hidden"><button type="button" id="btnBiometricUnlock" class="biometric-icon-button" onclick="unlockWithBiometric()">🫆</button><button type="button" id="btnRemoveBiometric" class="btn-danger" onclick="removeBiometric()">Xóa Face ID / vân tay</button></div><button type="button" id="btnRegisterBiometric" class="btn-outline" onclick="registerBiometric()">📱 Đăng ký Face ID / vân tay</button></div><div id="biometricStatus" class="biometric-status"></div><div id="authError" style="color:#e11d48; display:none;"></div></div>
  <div id="appScreen" class="hidden"><div class="top-bar"><div class="brand-title">👨‍👩‍👧‍👦 Quản lý gia đình</div><div class="btn-group"><a class="btn-back" href="index.html">↩ Trang chủ</a><button class="btn-danger" onclick="lockApp()">🔒 Khóa</button></div></div><div id="homeView" class="hidden"></div><div id="tableView" class="hidden"></div><div id="formView" class="hidden"></div><div id="detailView" class="hidden"></div><div id="docsView" class="detail-view"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;"><a class="btn-back" href="member.html?id=" id="docsBackLink">↩ Quay lại hồ sơ</a><button class="btn-primary" onclick="openUploadDocModal()">＋ Tải lên tệp giấy tờ</button></div><div class="explorer-header"><div><h2 id="docsOwnerName" style="color:var(--navy); font-size:1.35rem;">📁 Hồ sơ giấy tờ</h2><div id="docsBreadcrumb" class="docs-breadcrumb">Thư mục gốc</div></div><div id="folderBackBtn" class="hidden"><button class="btn-outline" onclick="renderDocsFolders()">⇦ Danh mục giấy tờ</button></div></div><div id="docsExplorerContent"></div></div></div>
  </div><div id="uploadDocModal" class="modal-overlay hidden" onclick="closeUploadDocModal()"><div class="modal-card" onclick="event.stopPropagation()"><h3>Thêm giấy tờ hồ sơ</h3><div class="form-group"><label>Loại giấy tờ</label><select id="docTypeSelect" onchange="toggleCustomDocName(this.value)"><option value="CCCD / Định danh">CCCD / Định danh cá nhân</option><option value="Giấy khai sinh">Giấy khai sinh</option><option value="Giấy đăng ký kết hôn">Giấy đăng ký kết hôn</option><option value="Sổ đỏ / Sổ hồng nhà đất">Sổ đỏ / Sổ hồng nhà đất</option><option value="Thẻ BHYT">Thẻ BHYT</option><option value="custom">Khác</option></select></div><div class="form-group hidden" id="customDocNameGroup"><input id="docCustomName" placeholder="Tên loại giấy tờ"></div><div class="form-group"><label>Tên trang / Nhãn nhận diện</label><input id="docDesc"></div><div class="form-group"><label>Chọn tệp</label><input type="file" id="docFileInput" accept="image/*,application/pdf"></div><button type="button" id="btnSaveDoc" class="btn-primary" onclick="saveDocument()">Tải lên & Lưu</button><button type="button" class="btn-outline" onclick="closeUploadDocModal()">Hủy</button></div></div><script src="js/config.js?v=15"></script><script src="js/auth.js?v=15"></script><script src="js/ui.js?v=15"></script><script src="js/members.js?v=15"></script><script src="js/page.js?v=1"></script></body></html>
